name: CI and deploy

# Manual, reviewed deployment: run this workflow from the GitHub Actions tab
# after the checks pass. Nothing deploys automatically on push, and no
# destructive database migration is ever applied from CI.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy Worker
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Create the token with the minimum scope: Account > Workers Scripts >
      # Edit, plus Account > D1 > Edit if CI should apply migrations.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      # Migrations are additive and must be reviewed first. Uncomment only
      # after running `wrangler d1 migrations apply brigada-onse-qr --remote`
      # manually the first time.
      # - name: Apply D1 migrations (remote)
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #   run: npx wrangler d1 migrations apply brigada-onse-qr --remote --env production
